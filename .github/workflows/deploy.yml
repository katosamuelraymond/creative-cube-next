name: Deploy Next.js

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}

      - name: Deploy to production
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/projects/next-app
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Waiting for health check..."
            sleep 35
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q app))
            if [ "$STATUS" != "healthy" ]; then
              echo "Health check failed — rolling back"
              docker compose down
              exit 1
            fi
            echo "Deploy successful"
            docker image prune -f

      - name: Deploy to staging
        if: github.ref_name == 'staging'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/projects/next-app-staging
            docker compose pull
            docker compose up -d db
            sleep 10
            docker run --rm --network next-app-staging_internal \
              -e DATABASE_URL=postgresql://nextuser:nextpass@next-app-staging-db-1:5432/nextdb \
              --entrypoint node \
              ghcr.io/katosamuelraymond/creative-cube-next:staging \
              node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.prisma || true
            docker compose up -d --remove-orphans
            echo "Waiting for health check..."
            sleep 60
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q app))
            if [ "$STATUS" != "healthy" ]; then
              echo "Health check failed — rolling back"
              docker compose down
              exit 1
            fi
            echo "Deploy successful"
            docker image prune -f